<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LaneWise">
  <!--
    LaneWise brand mark, square lockup (task 22, SG-004): three checkout lanes
    of rising height on a shared floor line. Same geometry as the BrandMark
    component (src/components/brand/brand-mark.tsx). A favicon cannot read CSS
    variables, so it carries the lw-brand / lw-on-brand token light values
    (blue-600 #1d4ed8 / slate-0 #ffffff) as the one intentional raw-hex asset.
    Re-export it when the brand ramps change (SG-004 "Swapping the brand", Q8).
  -->
  <rect width="64" height="64" fill="#1d4ed8"/>
  <rect x="16" y="30" width="8" height="18" fill="#ffffff"/>
  <rect x="28" y="22" width="8" height="26" fill="#ffffff"/>
  <rect x="40" y="14" width="8" height="34" fill="#ffffff"/>
  <rect x="12" y="36" width="40" height="2" fill="#1d4ed8"/>
</svg>
