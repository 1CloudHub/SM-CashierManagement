version: 0.2

# LaneWise deploy — Build stage (spec task 3.4, DEP-002).
#
# Runs in the CodePipeline "Build" stage on merge to `main`. It installs
# dependencies and builds the shared types, the staffing domain (used by the
# API's demo seed CLI), the API Lambda bundle
# (api/dist/lambda), the SPA (frontend) and the CDK app, then hands the whole
# workspace forward as the build artifact so the Deploy stage can run
# `cdk deploy` against the already-built outputs.
#
# Repo layout assumed: /packages/shared, /packages/domain, /packages/matching, /api,
# /frontend, /infra at the repo root. CodePipeline places the source at $CODEBUILD_SRC_DIR.
#
# Artifacts: the entire tree is exported so the Deploy stage has the built SPA
# (frontend/dist), the API bundle (api/dist/lambda, deployed as the Lambda code
# by the ApiStack) and the infra CDK app. The Deploy stage re-runs
# `cdk synth`/`deploy` from infra, so it needs no API rebuild.

env:
  variables:
    CI: "true"
    LANEWISE_ENV: prod

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "install — restoring dependencies (shared + domain + matching + API + frontend + infra)"
      - cd "$CODEBUILD_SRC_DIR/packages/shared" && npm ci
      - cd "$CODEBUILD_SRC_DIR/packages/domain" && npm ci
      - cd "$CODEBUILD_SRC_DIR/packages/matching" && npm ci
      - cd "$CODEBUILD_SRC_DIR/api" && npm ci
      - cd "$CODEBUILD_SRC_DIR/frontend" && npm ci
      - cd "$CODEBUILD_SRC_DIR/infra" && npm ci

  build:
    commands:
      - echo "build — shared types + staffing domain + API bundle + SPA (frontend) + CDK app (infra)"
      - cd "$CODEBUILD_SRC_DIR/packages/shared" && npm run build
      # The API depends on @lanewise/domain (file:) for the demo seed CLI (task 23).
      - cd "$CODEBUILD_SRC_DIR/packages/domain" && npm run build
      # ... and on @lanewise/matching (file:) for the network map (task 16).
      - cd "$CODEBUILD_SRC_DIR/packages/matching" && npm run build
      - cd "$CODEBUILD_SRC_DIR/api" && npm run build
      - cd "$CODEBUILD_SRC_DIR/frontend" && npm run build
      - cd "$CODEBUILD_SRC_DIR/infra" && npm run build
      - echo "cdk synth — validate the cloud assembly before deploy"
      - cd "$CODEBUILD_SRC_DIR/infra" && npx cdk synth

artifacts:
  # Carry the workspace forward to the Deploy stage: built SPA (frontend/dist)
  # and the infra app. node_modules is excluded: the artifact zip flattens its
  # .bin symlinks, so the Deploy stage reinstalls dependencies instead.
  files:
    - '**/*'
  exclude-paths:
    - '**/node_modules/**'
  base-directory: .
