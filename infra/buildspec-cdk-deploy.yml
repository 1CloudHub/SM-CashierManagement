version: 0.2

# LaneWise deploy — Deploy stage (spec task 3.4, DEP-003).
#
# Runs in the CodePipeline "Deploy" stage on merge to `main`, consuming the
# artifact produced by buildspec-deploy.yml (built SPA + infra app + deps). It
# deploys the LaneWise stacks to AWS prod and publishes the SPA:
#
#   1. `cdk deploy` all LaneWise-prod stacks (SPA hosting, API/Lambda + API
#      Gateway, and supporting stacks). CloudFormation reconciles infra changes.
#   2. Write the SPA runtime config (frontend/dist/runtime-config.json: Cognito
#      user pool + app client ids, region, API URL) from the Auth/Api stack
#      outputs, so the same SPA build works in any environment.
#
# Regions: SpaHosting + the CI/CD stacks deploy to us-east-1, the application
# stacks (Auth, Data, Jobs, Location, Api) to us-east-2 (config/environments.ts
# `region` / `appRegion`). Stack outputs are read with `--region` per stack.
#   3. Upload the freshly built SPA (frontend/dist) to the SPA S3 bucket.
#   4. Invalidate the CloudFront distribution so the new SPA is served
#      immediately.
#
# The S3 bucket name and CloudFront distribution id are read at deploy time from
# the SpaHosting stack's CloudFormation outputs (SpaBucketName / DistributionId),
# so nothing is hardcoded and this keeps working as the stack evolves.
#
# CodeBuild runs this under the shared CodeBuild role, which already holds the
# CDK bootstrap-role assume grant that `cdk deploy` requires (task 3.2). It does
# NOT run here as part of synth/test — this file is only invoked by the deploy
# pipeline's Deploy stage.

env:
  variables:
    CI: "true"
    LANEWISE_ENV: prod
    SPA_STACK_NAME: LaneWise-prod-SpaHosting
    AUTH_STACK_NAME: LaneWise-prod-Auth
    API_STACK_NAME: LaneWise-prod-Api

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "install — ensuring infra dependencies are present"
      # Always reinstall: node_modules from the Build artifact is not usable,
      # because zipping it flattens the node_modules/.bin symlinks into copies
      # (e.g. .bin/cdk then fails with "Cannot find module '../lib'").
      - cd "$CODEBUILD_SRC_DIR/infra" && npm ci

  build:
    commands:
      - echo "deploy — cdk deploy all LaneWise-prod stacks"
      # Deploy every LaneWise stack for this env. --require-approval never so the
      # pipeline is non-interactive; the promotion gate (when added) is the human
      # checkpoint, not an IAM prompt.
      - cd "$CODEBUILD_SRC_DIR/infra" && npx cdk deploy --all --require-approval never

  post_build:
    commands:
      # post_build runs even when build fails; only publish after a successful deploy.
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" != "1" ]; then
          echo "cdk deploy failed — skipping SPA publish"; exit 1
        fi
      - echo "publish SPA — sync frontend/dist to S3 + invalidate CloudFront"
      # Each stack is queried in its own region, read from the cloud assembly
      # `cdk deploy` just produced (cdk.out/manifest.json): SpaHosting in the
      # home region (us-east-1), Auth/Api in the app region (prod: us-east-2).
      # The SPA runtime config (task 7) carries the app region and the Cognito
      # ids + API URL the SPA needs at start-up. Public identifiers only — no
      # secrets (the app client has none).
      - |
        set -eu
        cd "$CODEBUILD_SRC_DIR/infra"
        SPA_REGION=$(node scripts/stack-region.mjs "$SPA_STACK_NAME")
        AUTH_REGION=$(node scripts/stack-region.mjs "$AUTH_STACK_NAME")
        API_REGION=$(node scripts/stack-region.mjs "$API_STACK_NAME")
        echo "regions: SPA=$SPA_REGION Auth=$AUTH_REGION Api=$API_REGION"
        stack_output() {
          aws cloudformation describe-stacks --region "$1" --stack-name "$2" \
            --query "Stacks[0].Outputs[?OutputKey=='$3'].OutputValue" --output text
        }
        SPA_BUCKET=$(stack_output "$SPA_REGION" "$SPA_STACK_NAME" SpaBucketName)
        DISTRIBUTION_ID=$(stack_output "$SPA_REGION" "$SPA_STACK_NAME" DistributionId)
        echo "SPA bucket=$SPA_BUCKET distribution=$DISTRIBUTION_ID"
        APP_REGION="$AUTH_REGION"
        USER_POOL_ID=$(stack_output "$AUTH_REGION" "$AUTH_STACK_NAME" UserPoolId)
        USER_POOL_CLIENT_ID=$(stack_output "$AUTH_REGION" "$AUTH_STACK_NAME" UserPoolClientId)
        SELF_SIGN_UP_ENABLED=$(stack_output "$AUTH_REGION" "$AUTH_STACK_NAME" SelfSignUpEnabled)
        API_URL=$(stack_output "$API_REGION" "$API_STACK_NAME" ApiUrl)
        export APP_REGION USER_POOL_ID USER_POOL_CLIENT_ID SELF_SIGN_UP_ENABLED API_URL
        node -e 'const e=process.env; if (!e.USER_POOL_ID.startsWith(e.APP_REGION + "_")) { console.error("user pool " + e.USER_POOL_ID + " is not in " + e.APP_REGION); process.exit(1); } require("fs").writeFileSync(process.argv[1], JSON.stringify({region:e.APP_REGION, userPoolId:e.USER_POOL_ID, userPoolClientId:e.USER_POOL_CLIENT_ID, selfSignUp:e.SELF_SIGN_UP_ENABLED==="true", apiUrl:e.API_URL}, null, 2));' "$CODEBUILD_SRC_DIR/frontend/dist/runtime-config.json"
        cat "$CODEBUILD_SRC_DIR/frontend/dist/runtime-config.json"
        # Upload the built SPA. --delete removes stale assets no longer in dist.
        aws s3 sync "$CODEBUILD_SRC_DIR/frontend/dist" "s3://$SPA_BUCKET" --delete --region "$SPA_REGION"
        # Invalidate the CloudFront cache so the new SPA is served immediately.
        aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
