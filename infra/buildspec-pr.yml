version: 0.2

# LaneWise pull-request checks (spec task 3.3, DEP-002).
#
# Runs on every pull request against `main` via the CodeStar (GitHub)
# Connection webhook and reports status back to the PR. A non-zero exit in any
# phase fails the build, which surfaces a failing check on the PR and — once the
# check is added to `main`'s required status checks (DEP-001) — blocks merge.
#
# Phase mapping to DEP-002 (install → build → lint → test → cdk synth/diff):
#   install  -> restore deps (shared types, API, frontend, infra, domain,
#               matching);
#               dependency-free repo scripts need no install.
#   build    -> build @lanewise/shared (consumed by the API and the SPA) and
#               the staffing domain (consumed by the API's demo seed), then
#               type-check and bundle the API Lambda + the Cognito pre-sign-up
#               trigger + the migrate/seed CLIs (api/dist/*), build the SPA,
#               type-check/emit the CDK app, build the cross-store matching
#               package.
#               Both bundles must exist before cdk synth / infra tests.
#   lint     -> ESLint (shared + API + frontend + infra + domain + matching) +
#               docs-conventions.
#   test     -> unit + property-based tests (shared + API + frontend + infra +
#               domain, incl. the prototype-v3 parity suite, + matching) + spec-format
#               validation.
#   cdk synth / cdk diff -> synthesize the CDK app and surface the infra delta.
#
# Repo layout assumed: /packages/shared, /packages/domain, /packages/matching, /api, /frontend,
# /infra, /scripts at the repo root. CodeBuild checks out the PR source branch
# at the repo root.
#
# Note: CodeBuild runs pre_build (lint) before build, so lint must not depend
# on build outputs (the shared package's lint type-checks its sources directly).

env:
  variables:
    # Keep CI installs deterministic and non-interactive.
    CI: "true"
    # cdk diff against the deployed stacks is best-effort in PR checks (the
    # bootstrap/deploy roles may not be assumable from the PR build); a diff
    # failure must not fail the check — synth is the gate. See the diff phase.
    LANEWISE_ENV: prod

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "install — restoring dependencies"
      - cd "$CODEBUILD_SRC_DIR/packages/shared" && npm ci
      - cd "$CODEBUILD_SRC_DIR/packages/domain" && npm ci
      - cd "$CODEBUILD_SRC_DIR/api" && npm ci
      - cd "$CODEBUILD_SRC_DIR/frontend" && npm ci
      - cd "$CODEBUILD_SRC_DIR/infra" && npm ci
      - cd "$CODEBUILD_SRC_DIR/packages/matching" && npm ci

  build:
    commands:
      - echo "build — shared types + API bundle + SPA + CDK app"
      - cd "$CODEBUILD_SRC_DIR/packages/shared" && npm run build
      # The API depends on @lanewise/domain (file:) for the demo seed (task 23),
      # so the domain package is built before the API.
      - cd "$CODEBUILD_SRC_DIR/packages/domain" && npm run build
      - cd "$CODEBUILD_SRC_DIR/api" && npm run build
      - cd "$CODEBUILD_SRC_DIR/frontend" && npm run build
      - cd "$CODEBUILD_SRC_DIR/infra" && npm run build
      - cd "$CODEBUILD_SRC_DIR/packages/matching" && npm run build

  pre_build:
    commands:
      - echo "lint — ESLint + docs-conventions"
      - cd "$CODEBUILD_SRC_DIR/packages/shared" && npm run lint
      - cd "$CODEBUILD_SRC_DIR/api" && npm run lint
      - cd "$CODEBUILD_SRC_DIR/frontend" && npm run lint
      - cd "$CODEBUILD_SRC_DIR/infra" && npm run lint
      - cd "$CODEBUILD_SRC_DIR/packages/domain" && npm run lint
      - cd "$CODEBUILD_SRC_DIR/packages/matching" && npm run lint
      # docs-conventions check (lint step). --changed scopes it to files changed
      # vs origin/main so PR builds stay fast (scripts/README.md, GOV-000).
      - cd "$CODEBUILD_SRC_DIR" && node scripts/check-docs-conventions.mjs --changed

  post_build:
    commands:
      - echo "test — unit + property tests + spec-format"
      - cd "$CODEBUILD_SRC_DIR/packages/shared" && npm test
      # API tests include the PostgreSQL-backed data-layer suites (schema
      # invariants, audit log, P7). Vitest's global setup starts an embedded
      # PostgreSQL 17 from the `embedded-postgres` npm binaries — no Docker or
      # privileged mode needed; as root (CodeBuild) it runs the server under a
      # `postgres` OS user it creates. Set TEST_DATABASE_URL to use an external
      # server instead.
      - cd "$CODEBUILD_SRC_DIR/api" && npm test
      - cd "$CODEBUILD_SRC_DIR/frontend" && npm test
      - cd "$CODEBUILD_SRC_DIR/infra" && npm test
      # Staffing domain: unit + property tests and the v3 parity suite (task 6.4).
      - cd "$CODEBUILD_SRC_DIR/packages/domain" && npm test
      # Cross-store matching: travel-time matrix + eligibility/ranking property tests (task 16.2/16.3, P15/P16).
      - cd "$CODEBUILD_SRC_DIR/packages/matching" && npm test
      # spec-format validation (test step) — scripts/README.md, GOV-000.
      - cd "$CODEBUILD_SRC_DIR" && node scripts/check-spec-format.mjs
      - echo "cdk synth — synthesize the CDK app (gate)"
      - cd "$CODEBUILD_SRC_DIR/infra" && npx cdk synth
      # cdk diff surfaces the infra delta for reviewers. It is best-effort: the
      # PR build may not be able to assume the deploy role to read live stacks,
      # so a diff failure is logged but does not fail the check (synth is the gate).
      - echo "cdk diff — surface the infra delta (best-effort)"
      - cd "$CODEBUILD_SRC_DIR/infra" && (npx cdk diff || echo "cdk diff could not compare against deployed stacks (non-fatal)")
